<text x="870" y="116" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#232F3E" text-anchor="middle">Option 2 · units</text>
<text x="1130" y="116" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#232F3E" text-anchor="middle">Option 3 · split + units</text>
<text x="40" y="180" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#5A6B7D" text-anchor="start">Config &amp; wiring</text>
