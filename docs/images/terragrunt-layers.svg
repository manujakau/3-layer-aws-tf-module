<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="578" viewBox="0 0 1310 578" role="img" aria-labelledby="t d">
<title id="t">Terragrunt options: what changes per layer</title>
<desc id="d">Layer comparison. Today and Option 1 both run composition/infra as the single root module; Option 1 only replaces the config row with Terragrunt files. Option 2 skips the composition layer and points each unit directly at an infrastructure module, giving five states. Option 3 splits composition/infra into four small composition roots, one per unit, giving four states.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#545B64"/></marker>
<marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D45B07"/></marker>
</defs>
<rect width="1310" height="578" fill="#FFFFFF"/>
<text x="40" y="38" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#232F3E" text-anchor="start">Terragrunt options: what changes per layer</text>
<text x="40" y="60" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5A6B7D" text-anchor="start">Option 1 keeps composition/infra as one root. Option 2 bypasses composition. Option 3 splits it into small roots.</text>
<text x="350" y="116" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#232F3E" text-anchor="middle">Today</text>
