<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="608" viewBox="0 0 1060 608" role="img" aria-labelledby="t d">
<title id="t">Option 3: Terragrunt units over small composition roots</title>
<desc id="d">Option 3. Four Terragrunt units in live/eu-central-1/prod (network, eks, ecr, ecs) each point at a small composition root with no environment folders, which calls the existing infrastructure modules. network passes subnets to eks and vpc_id plus private subnets to ecs; ecr passes the repository URL to ecs. The ECS security-group self-wiring stays in composition/ecs.</desc>
