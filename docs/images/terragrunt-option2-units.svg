<svg xmlns="http://www.w3.org/2000/svg" width="980" height="598" viewBox="0 0 980 598" role="img" aria-labelledby="t d">
<title id="t">Option 2: Terragrunt units and their dependencies</title>
<desc id="d">Option 2 dependency graph. Wave 1 applies vpc, ecr and vpn, which have no dependencies. Wave 2 applies eks, which reads subnets from vpc, and ecs, which reads vpc_id and private subnets from vpc and the repository URL from ecr. Each unit has its own state. The remotebackend bootstrap sits outside the graph and creates the state bucket.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#545B64"/></marker>
<marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D45B07"/></marker>
</defs>
<rect width="980" height="598" fill="#FFFFFF"/>
<text x="40" y="38" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#232F3E" text-anchor="start">Option 2: Terragrunt units and their dependencies</text>
<text x="40" y="60" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5A6B7D" text-anchor="start">Each infrastructure module is a unit with its own state. run --all applies them in two waves.</text>
<text x="200" y="112" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#232F3E" text-anchor="middle">Wave 1 · no dependencies</text>
<text x="740" y="112" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#232F3E" text-anchor="middle">Wave 2 · after wave 1</text>
<rect x="100" y="134" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#8D99A8" stroke-width="1.2"/>
<text x="200.0" y="157.0" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#232F3E" text-anchor="middle">vpc</text>
<text x="200.0" y="176.0" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#5A6B7D" text-anchor="middle">infrastructure_modules/vpc</text>
<text x="200" y="206" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#5A6B7D" text-anchor="middle">state: …/prod/vpc</text>
<rect x="100" y="254" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#8D99A8" stroke-width="1.2"/>
<text x="200.0" y="277.0" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#232F3E" text-anchor="middle">ecr</text>
<text x="200.0" y="296.0" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#5A6B7D" text-anchor="middle">infrastructure_modules/ecr</text>
<text x="200" y="326" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#5A6B7D" text-anchor="middle">state: …/prod/ecr</text>
<rect x="100" y="374" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#8D99A8" stroke-width="1.2"/>
<text x="200.0" y="397.0" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#232F3E" text-anchor="middle">vpn</text>
<text x="200.0" y="416.0" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#5A6B7D" text-anchor="middle">infrastructure_modules/vpn</text>
<text x="200" y="446" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#5A6B7D" text-anchor="middle">state: …/prod/vpn · no deps</text>
<rect x="640" y="134" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#8D99A8" stroke-width="1.2"/>
<text x="740.0" y="157.0" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#232F3E" text-anchor="middle">eks</text>
<text x="740.0" y="176.0" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#5A6B7D" text-anchor="middle">infrastructure_modules/eks</text>
<text x="740" y="206" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#5A6B7D" text-anchor="middle">state: …/prod/eks</text>
