<text x="740.0" y="296.0" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#5A6B7D" text-anchor="middle">infrastructure_modules/ecs</text>
<text x="740" y="326" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#5A6B7D" text-anchor="middle">state: …/prod/ecs</text>
<text x="740" y="344" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#D45B07" text-anchor="middle">SG wiring must move inside the module</text>
<line x1="302" y1="162" x2="636" y2="162" stroke="#D45B07" stroke-width="1.6" marker-end="url(#flow)"/>
<text x="469" y="154" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="600" fill="#D45B07" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">public_subnets · private_subnets</text>
<line x1="302" y1="180" x2="636" y2="268" stroke="#D45B07" stroke-width="1.6" marker-end="url(#flow)"/>
<text x="471" y="217" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="600" fill="#D45B07" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke" transform="rotate(14.8 471 217)">vpc_id · private_subnets</text>
<line x1="302" y1="282" x2="636" y2="282" stroke="#D45B07" stroke-width="1.6" marker-end="url(#flow)"/>
<text x="469" y="274" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="600" fill="#D45B07" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ecr_repository_url</text>
<rect x="70" y="472" width="840" height="50" rx="8" fill="none" stroke="#9AA5B1" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="490.0" y="492.0" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#232F3E" text-anchor="middle">bootstrap/remotebackend · plain Terraform, local state, outside the graph</text>
<text x="490.0" y="511.0" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#5A6B7D" text-anchor="middle">creates the S3 bucket that all five unit states live in · bucket name is fixed in root.hcl</text>
<rect x="40" y="557" width="26" height="15" rx="8" fill="#FDF1E8" stroke="#D45B07" stroke-width="1.4"/>
<text x="74" y="568" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#5A6B7D" text-anchor="start">new or changed by Terragrunt</text>
<rect x="270" y="557" width="26" height="15" rx="8" fill="none" stroke="#9AA5B1" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="304" y="568" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#5A6B7D" text-anchor="start">retired / outside the run graph</text>
<line x1="510" y1="564" x2="544" y2="564" stroke="#D45B07" stroke-width="1.6" marker-end="url(#flow)"/>
<text x="552" y="568" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#5A6B7D" text-anchor="start">added by Terragrunt</text>
