<svg xmlns="http://www.w3.org/2000/svg" width="980" height="468" viewBox="0 0 980 468" role="img" aria-labelledby="t d">
<title id="t">Option 1: Terragrunt wraps the existing composition</title>
<desc id="d">Option 1. root.hcl is included by terragrunt.hcl in the infra composition folder. terragrunt.hcl passes inputs to variables.tf, fills the empty S3 backend block in providers.tf at init, and generates provider_aws.tf with the region. The remotebackend bootstrap stays plain Terraform and creates the S3 bucket that holds the infra state.</desc>
